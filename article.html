var CACHE_TRAD={}; try{CACHE_TRAD=JSON.parse(localStorage.getItem("rocy_trad_cache")||"{}")}catch(e){CACHE_TRAD={}}
async function traduireTexte(texte, cible){
  if(!texte||!texte.trim()) return texte;
  if(!cible||cible==="fr") return texte;
  var langAPI=cible; if(["yo","fon","goun"].includes(cible)) langAPI="en";
  var cle=texte+"||"+langAPI; if(CACHE_TRAD[cle]) return CACHE_TRAD[cle];
  try{ var r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(texte)+"&langpair=fr|"+langAPI); var j=await r.json(); var t=(j&&j.responseData&&j.responseData.translatedText)?j.responseData.translatedText:texte; if(!t||t.toLowerCase()===texte.toLowerCase()) t=texte; CACHE_TRAD[cle]=t; try{localStorage.setItem("rocy_trad_cache",JSON.stringify(CACHE_TRAD))}catch(e){} return t; }catch(e){ return texte; }
}
async function traduireContenuProduit(){
  if(!PRODUIT) return;
  var langue=LANGUE_ACTUELLE;
  var nomEl=document.getElementById('nomProduit'), descEl=document.getElementById('descProduit'), descP=document.getElementById('descPopup'), villeEl=document.getElementById('villeProduit');
  if(langue==="fr"){ if(nomEl&&nomEl.getAttribute("data-original")) nomEl.textContent=nomEl.getAttribute("data-original"); if(descEl&&descEl.getAttribute("data-original")) descEl.textContent=descEl.getAttribute("data-original"); if(descP&&descP.getAttribute("data-original")) descP.textContent=descP.getAttribute("data-original"); if(villeEl&&villeEl.getAttribute("data-original")) villeEl.textContent=villeEl.getAttribute("data-original"); return; }
  var liste=[nomEl,descEl,descP,villeEl];
  for(var i=0;i<liste.length;i++){ var el=liste[i]; if(!el) continue; var orig=el.getAttribute("data-original")||el.textContent; if(!orig) continue; el.setAttribute("data-original",orig); el.textContent=await traduireTexte(orig,langue); }
}

function appliquerTraduction(){
  var d=TRADUCTIONS[LANGUE_ACTUELLE]||TRADUCTIONS.fr;
  var set=function(id,txt){var el=document.getElementById(id); if(el) el.textContent=txt};
  set('titreDesc',d.desc); set('btnChat',d.chat); set('btnCommander',d.commander); set('popupTitre',d.desc); set('btnRetour',d.retour); set('txtEmail',d.email);
  var fer=document.querySelector('#menuPanel .fermer'); if(fer) fer.textContent=d.fermer;
  document.documentElement.dir=(LANGUE_ACTUELLE==="ar")?"rtl":"ltr"; document.documentElement.lang=LANGUE_ACTUELLE;
  try{construireMenu()}catch(e){}
  afficherPrixEtInfo(); traduireContenuProduit();
}
function changerLangue(v){ LANGUE_ACTUELLE=v; localStorage.setItem("rocy_lang",v); var s=document.getElementById("langue"); if(s) s.value=v; appliquerTraduction(); }
function changerDevise(v){ DEVISE_ACTUELLE=v; localStorage.setItem("rocy_devise",v); var s=document.getElementById("devise"); if(s) s.value=v; afficherPrixEtInfo(); }
function getRole(){ return localStorage.getItem("rocy_role")||"visiteur"; }
function ouvrirMenu(){ construireMenu(); document.getElementById('overlayMenu').style.display='block'; document.getElementById('menuPanel').style.display='block'; }
function fermerMenu(){ document.getElementById('overlayMenu').style.display='none'; document.getElementById('menuPanel').style.display='none'; }
function construireMenu(){ var role=getRole(); var nom=localStorage.getItem('nom_user')||''; var d=TRADUCTIONS[LANGUE_ACTUELLE]||TRADUCTIONS.fr; document.getElementById('menuBonjour').textContent=nom?d.bonjour+' '+nom+' ('+role+')':d.bienvenue; var l=''; l+='<a href="index.html">'+d.menuAccueil+'</a>'; if(role==='vendeur') l+='<a href="vendeur.html">'+d.menuVendeur+'</a>'; if(role==='acheteur') l+='<a href="acheteur.html">'+d.menuAcheteur+'</a>'; if(role==='admin') l+='<a href="admin.html">'+d.menuAdmin+'</a>'; l+='<a href="publier.html">'+d.menuPublier+'</a>'; if(role!=='visiteur') l+='<a href="profil.html">'+d.menuProfil+'</a>'; l+='<a href="conditions.html">'+d.menuConditions+'</a>'; l+='<a href="contact.html">'+d.menuContact+'</a>'; l+='<a href="apropos.html">'+d.menuApropos+'</a>'; if(role==='visiteur'){ l+='<a href="connexion.html">'+d.menuConnecter+'</a>'; l+='<a href="inscription.html">'+d.menuInscription+'</a>'; } else { l+='<a href="#" onclick="deconnexion();return false;" class="rouge">'+d.menuDeconnecter+'</a>'; } document.getElementById('liensMenu').innerHTML=l; }
function deconnexion(){ localStorage.removeItem("rocy_role"); localStorage.removeItem("rocy_user"); localStorage.removeItem("nom_user"); localStorage.removeItem("email_user"); window.location.href="index.html"; }
function formaterPrix(prixFCFA){ var taux=TAUX[DEVISE_ACTUELLE]||1; var v=Math.round(prixFCFA*taux*100)/100; if(DEVISE_ACTUELLE==="FCFA") return Math.round(prixFCFA).toLocaleString('fr-FR')+" F"; return v+" "+SYMBOLE[DEVISE_ACTUELLE].trim(); }
function afficherPrixEtInfo(){
  if(!PRODUIT) return; var d=TRADUCTIONS[LANGUE_ACTUELLE]||TRADUCTIONS.fr;
  var prixFCFA=Number(PRODUIT.prix||0); var prixAffiche=formaterPrix(prixFCFA);
  var prixUSD=prixFCFA*TAUX.USD; var vendeurRecoitUSD=prixUSD*0.915;
  var html="<b>"+d.avant+"</b><br>"+d.livraison+"<br>"+d.delai+"<br>"+d.protection+"<br>"+d.prixProduit+" : <b>"+prixAffiche+"</b><br>"+d.livraison2+"<br><b>"+d.total+" : "+prixAffiche+" "+d.sansLivraison+"</b><br>"+d.recevra+" "+vendeurRecoitUSD.toFixed(2)+" $ "+d.apresClic+"<br>"+d.commission+"<br><br><b>"+d.comment+"</b><br>"+d.etapes;
  var bloc=document.getElementById('blocInfo'); if(bloc) bloc.innerHTML=html;
  var popupInfo=document.getElementById('popupInfo'); if(popupInfo) popupInfo.innerHTML=html;
  var prixEl=document.getElementById('prixProduit'); if(prixEl) prixEl.textContent=prixAffiche;
}
function ouvrirPopup(){ var p=document.getElementById('popupDesc'); if(p) p.style.display='flex'; }
function fermerPopup(){ var p=document.getElementById('popupDesc'); if(p) p.style.display='none'; }
function discuter(){ if(!PRODUIT) return; var tel=PRODUIT.telephone_vendeur||PRODUIT.telephone||""; if(tel){ window.open("https://wa.me/"+String(tel).replace(/[^0-9]/g,""),"_blank"); } else { alert("Chat bientôt - contacte le vendeur"); } }
async function chargerProduit(){
  var supa=null; try{ supa=window.supabase.createClient('https://ahoxxzmdjxqvvpphxeow.supabase.co','sb_publishable_Q2oaPQMj4H_cTlZCKKh6Jg_FVIa7VE3'); }catch(e){}
  var params=new URLSearchParams(window.location.search); var id=params.get('id'); if(!id){ document.getElementById('msg').textContent="Produit introuvable"; return; }
  try{
    var res=await supa.from('produits').select('*').eq('id',id).maybeSingle();
    if(res.error) throw res.error; if(!res.data){ document.getElementById('msg').textContent="Produit introuvable"; return; }
    PRODUIT=res.data;
    var photo=PRODUIT.photo||PRODUIT.image||""; var img=document.getElementById('photoProduit'); if(img&&photo) img.src=photo;
    var nomEl=document.getElementById('nomProduit'); nomEl.textContent=PRODUIT.nom||""; nomEl.setAttribute("data-original",PRODUIT.nom||"");
    var descEl=document.getElementById('descProduit'); descEl.textContent=PRODUIT.description||""; descEl.setAttribute("data-original",PRODUIT.description||"");
    var descP=document.getElementById('descPopup'); descP.textContent=PRODUIT.description||""; descP.setAttribute("data-original",PRODUIT.description||"");
    var villeEl=document.getElementById('villeProduit'); var villeTxt="• • "+(PRODUIT.ville||""); villeEl.textContent=villeTxt; villeEl.setAttribute("data-original",villeTxt);
    var nomV=PRODUIT.nom_vendeur||"Vendeur"; var nomVEl=document.getElementById('nomVendeur'); nomVEl.textContent=nomV; // nom propre : jamais traduit
    var villeV=document.getElementById('villeVendeur'); if(villeV) villeV.textContent=PRODUIT.ville||"";
    var av=document.getElementById('avatarVendeur'); var photoV=PRODUIT.photo_vendeur||""; if(av){ if(photoV&&photoV.length>5){ av.innerHTML='<img src="'+photoV+'">'; } else { av.textContent=(nomV||"V").charAt(0); } }
    appliquerTraduction();
  }catch(e){ document.getElementById('msg').textContent="Erreur : "+(e.message||JSON.stringify(e)); }
}

  // Si on arrive sur /ar par erreur (ancien onglet), on se remet sur la bonne URL
  if(window.location.pathname.endsWith("/ar")||window.location.pathname.endsWith("/es")||window.location.pathname.endsWith("/en")){
    window.history.replaceState({},"","article.html"+window.location.search);
  }
  var sel=document.getElementById("langue"); if(sel) sel.value=LANGUE_ACTUELLE;
  var dev=document.getElementById("devise"); if(dev) dev.value=DEVISE_ACTUELLE;
  construireMenu(); chargerProduit();
});
