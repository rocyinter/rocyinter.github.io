<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publier - ROCYINTER</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="commun.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:'Inter',Arial,sans-serif;background:#f6f6f6;margin:0;color:#1a1a1a}
header{background:#111;color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
header .logo{font-size:17px;font-weight:800}
header .logo span{color:#FFC107}
.header-droite{display:flex;gap:6px;align-items:center}
.header-droite select{background:#fff;border:0;border-radius:8px;height:32px;padding:0 6px;font-size:11px;font-weight:600;cursor:pointer;max-width:110px}
.btn-menu{background:#fff;color:#111;border:0;font-size:17px;width:32px;height:32px;border-radius:8px;cursor:pointer;font-weight:900}
#overlayMenu{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200}
#menuPanel{position:fixed;top:0;right:0;width:260px;max-width:85vw;height:100%;background:#fff;z-index:201;padding:14px;overflow:auto}
#menuPanel h3{margin:0 0 3px;font-size:17px;font-weight:800}
#menuPanel h3 span{color:#FFC107}
#menuPanel p{margin:0 0 10px;color:#666;font-size:11px}
#menuPanel a{display:block;padding:10px 8px;border-radius:8px;text-decoration:none;color:#1a1a1a;font-weight:600;font-size:13px;border-bottom:1px solid #f0f0f0}
#menuPanel .rouge{color:#D32F2F}
#menuPanel .fermer{background:#111;color:#fff;text-align:center}
.container{max-width:520px;margin:12px auto;background:#fff;padding:14px;border-radius:12px}
h2{margin:0 0 4px;font-size:18px}
.sous{color:#666;font-size:12px;margin:0 0 12px}
label{display:block;font-size:12px;font-weight:700;margin:10px 0 4px}
input,textarea,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;font-size:13px;background:#fff}
textarea{min-height:90px;resize:vertical}
.btn{width:100%;background:#FF6B00;color:#fff;border:0;padding:13px;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;margin-top:14px}
.btn:disabled{opacity:.6}
.btn2{width:100%;background:#111;color:#fff;border:0;padding:11px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;margin-top:8px}
.info-vendeur{display:flex;gap:10px;align-items:center;background:#FFF8E1;border:1px solid #FFC107;padding:10px;border-radius:10px;font-size:12px;line-height:1.5}
.avatar{width:42px;height:42px;background:#FF6B00;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.preview{width:100%;height:200px;object-fit:cover;border-radius:10px;background:#eee;display:none;margin-top:8px}
.msg{font-size:12px;margin-top:10px;line-height:1.5}
.msg.ok{color:#2e7d32}
.msg.err{color:#D32F2F}
footer{background:#111;color:#fff;padding:10px 12px;text-align:center;margin-top:10px;font-size:9px;line-height:1.4}
footer a{color:#FFC107;text-decoration:none;font-weight:700}
@media(min-width:768px){.container{max-width:640px}}
</style>
</head>
<body>
<header><div class="logo">ROCY<span>INTER</span></div><div class="header-droite"><select id="langue" onchange="changerLangue(this.value)"><option value="fr">Français</option><option value="en">English</option><option value="yo">Yoruba</option><option value="fon">Fon</option><option value="goun">Goun</option><option value="es">Español</option><option value="pt">Português</option><option value="de">Deutsch</option><option value="ar">العربية</option></select><button class="btn-menu" onclick="ouvrirMenu()">☰</button></div></header>
<div id="overlayMenu" onclick="fermerMenu()"></div>
<div id="menuPanel" style="display:none"><h3>ROCY <span>INTER</span></h3><p id="menuBonjour">Bienvenue</p><div id="liensMenu"></div><br><a href="#" class="fermer" onclick="fermerMenu();return false;">Fermer ✕</a></div>

<div class="container">
<h2 id="titrePublier">➕ Publier un produit</h2>
<p class="sous" id="sousPublier">Ton nom et ta photo seront affichés automatiquement aux acheteurs.</p>

<div class="info-vendeur">
<div class="avatar" id="avatarVendeur">V</div>
<div><b id="nomVendeurAffiche">Chargement...</b><br><span id="emailVendeurAffiche" style="color:#666"></span><br><span id="statutVendeur" style="color:#2e7d32;font-weight:700">● Vendeur vérifié pour publication</span></div>
</div>

<label id="lblNom">Nom du produit *</label>
<input id="nom" placeholder="Ex: Ustensiles de maison, Chaussures...">

<label id="lblPrix">Prix en FCFA *</label>
<input id="prix" type="number" inputmode="numeric" placeholder="Ex: 15000">

<label id="lblVille">Ville *</label>
<input id="ville" placeholder="Ex: Cotonou, Abomey-Calavi...">

<label id="lblStock">Stock</label>
<input id="stock" type="number" value="1" min="1">

<label id="lblCategorie">Catégorie</label>
<select id="categorie">
<option value="general">Général</option>
<option value="maison">Maison</option>
<option value="mode">Mode</option>
<option value="electronique">Électronique</option>
<option value="beaute">Beauté</option>
<option value="service">Service</option>
<option value="autre">Autre</option>
</select>

<label id="lblPhoto">Photo du produit *</label>
<input type="file" id="photoFile" accept="image/*" onchange="previewPhoto(this)">
<img id="previewImg" class="preview">
<label id="lblPhotoUrl">Ou lien photo (optionnel)</label>
<input id="photoUrl" placeholder="https://...">

<label id="lblDesc">Description *</label>
<textarea id="description" placeholder="Décris ton produit : taille, couleur, état, livraison..."></textarea>

<button class="btn" id="btnPublier" onclick="publier()">🚀 PUBLIER MON PRODUIT</button>
<button class="btn2" onclick="window.location.href='vendeur.html'">← Aller à mon Tableau Vendeur</button>
<div id="msg" class="msg"></div>
</div>

<footer><p><span id="txtEmail">Email :</span> <a href="mailto:rocyinter@gmail.com">rocyinter@gmail.com</a> &nbsp;|&nbsp; Rocyinter@2026</p></footer>
<script>
var LANGUE_ACTUELLE = localStorage.getItem("rocy_lang") || "fr";
var TRADUCTIONS = {
fr:{bonjour:"Bonjour",bienvenue:"Bienvenue",menuAccueil:"🏠 Accueil",menuVendeur:"📦 Mon Tableau Vendeur",menuAcheteur:"🛒 Mes Commandes",menuAdmin:"🛡️ Admin",menuPublier:"➕ Publier un produit",menuProfil:"👤 Mon Profil",menuConditions:"📜 Conditions",menuContact:"📞 Contact",menuApropos:"ℹ️ À propos",menuConnecter:"🔑 Se connecter",menuInscription:"✍️ S'inscrire",menuDeconnecter:"🚪 Se déconnecter"},
en:{bonjour:"Hello",bienvenue:"Welcome",menuAccueil:"🏠 Home",menuVendeur:"📦 My Seller Dashboard",menuAcheteur:"🛒 My Orders",menuAdmin:"🛡️ Admin",menuPublier:"➕ Publish a product",menuProfil:"👤 My Profile",menuConditions:"📜 Terms",menuContact:"📞 Contact",menuApropos:"ℹ️ About",menuConnecter:"🔑 Log in",menuInscription:"✍️ Sign up",menuDeconnecter:"🚪 Log out"}
};
TRADUCTIONS.yo=TRADUCTIONS.en; TRADUCTIONS.fon=TRADUCTIONS.en; TRADUCTIONS.goun=TRADUCTIONS.en; TRADUCTIONS.es=TRADUCTIONS.en; TRADUCTIONS.pt=TRADUCTIONS.en; TRADUCTIONS.de=TRADUCTIONS.en; TRADUCTIONS.ar=TRADUCTIONS.en;

function changerLangue(v){ LANGUE_ACTUELLE=v; localStorage.setItem("rocy_lang",v); var sel=document.getElementById("langue"); if(sel) sel.value=v; construireMenu(); }
function getRole(){ return localStorage.getItem("rocy_role") || "visiteur"; }
function ouvrirMenu(){ construireMenu(); document.getElementById('overlayMenu').style.display='block'; document.getElementById('menuPanel').style.display='block'; }
function fermerMenu(){ document.getElementById('overlayMenu').style.display='none'; document.getElementById('menuPanel').style.display='none'; }
function construireMenu(){
  var role=getRole(); var nom=localStorage.getItem('nom_user')||'';
  var d=TRADUCTIONS[LANGUE_ACTUELLE]||TRADUCTIONS.fr;
  document.getElementById('menuBonjour').textContent = nom ? d.bonjour+' '+nom+' ('+role+')' : d.bienvenue;
  var l=''; l+='<a href="index.html">'+d.menuAccueil+'</a>';
  if(role==='vendeur') l+='<a href="vendeur.html">'+d.menuVendeur+'</a>';
  if(role==='acheteur') l+='<a href="acheteur.html">'+d.menuAcheteur+'</a>';
  if(role==='admin') l+='<a href="admin.html">'+d.menuAdmin+'</a>';
  l+='<a href="publier.html">'+d.menuPublier+'</a>'; if(role!=='visiteur') l+='<a href="profil.html">'+d.menuProfil+'</a>';
  l+='<a href="conditions.html">'+d.menuConditions+'</a>'; l+='<a href="contact.html">'+d.menuContact+'</a>'; l+='<a href="apropos.html">'+d.menuApropos+'</a>';
  if(role==='visiteur'){ l+='<a href="connexion.html">'+d.menuConnecter+'</a>'; l+='<a href="inscription.html">'+d.menuInscription+'</a>'; }
  else { l+='<a href="#" onclick="deconnexion();return false;" class="rouge">'+d.menuDeconnecter+'</a>'; }
  document.getElementById('liensMenu').innerHTML=l;
}
function deconnexion(){ localStorage.removeItem("rocy_role"); localStorage.removeItem("rocy_user"); localStorage.removeItem("nom_user"); localStorage.removeItem("email_user"); window.location.href="index.html"; }

// ===== CORRECTION VENDEUR - NE PLUS JAMAIS PUBLIER SANS VENDEUR =====
let supabaseClient = window.rocyClient || null;
let vendeurInfos = { id:"", nom:"", email:"", telephone:"", photo:"" };
let photoBase64 = "";

function initSupabase(){
  try{
    if(window.rocyClient) supabaseClient = window.rocyClient;
    else if(window.supabase && window.supabase.createClient){
      supabaseClient = window.supabase.createClient('https://ahoxxzmdjxqvvpphxeow.supabase.co', 'sb_publishable_Q2oaPQMj4H_cTlZCKKh6Jg_FVIa7VE3');
    }
  }catch(e){}
}

async function chargerVendeur(){
  var msgEl = document.getElementById('msg');
  // Si pas connecté, on bloque
  if(!localStorage.getItem("rocy_user")){
    if(msgEl){ msgEl.className="msg err"; msgEl.textContent="Tu dois te connecter comme vendeur pour publier. Redirection..."; }
    setTimeout(function(){ window.location.href="connexion.html"; }, 1200);
    return;
  }
  var userId = localStorage.getItem("user_id") || "";
  var email = localStorage.getItem("email_user") || localStorage.getItem("rocy_user") || "";
  var nomLocal = localStorage.getItem("nom_user") || "";
  var telLocal = localStorage.getItem("tel_user") || localStorage.getItem("telephone_user") || "";
  var photoLocal = localStorage.getItem("photo_user") || "";

  vendeurInfos = { id: userId, nom: nomLocal, email: email, telephone: telLocal, photo: photoLocal };

  // On va chercher le vrai profil dans Supabase, c'est la source de vérité
  if(supabaseClient && userId){
    try{
      var r = await supabaseClient.from('profils').select('*').eq('id', userId).maybeSingle();
      if(r && r.data){
        var p = r.data;
        vendeurInfos.nom = p.nom_entreprise || p.nom_complet || p.nom || vendeurInfos.nom;
        vendeurInfos.telephone = p.telephone || p.tel || vendeurInfos.telephone;
        vendeurInfos.photo = p.photo_profil || p.photo || p.avatar || vendeurInfos.photo;
        vendeurInfos.email = p.email || vendeurInfos.email;
        // On met à jour localStorage pour la prochaine fois
        if(vendeurInfos.nom) localStorage.setItem("nom_user", vendeurInfos.nom);
        if(vendeurInfos.telephone) localStorage.setItem("tel_user", vendeurInfos.telephone);
        if(vendeurInfos.photo) localStorage.setItem("photo_user", vendeurInfos.photo);
      }
    }catch(e){ console.log("profil vendeur", e); }
  }
  // Affichage
  var nomEl = document.getElementById('nomVendeurAffiche');
  if(nomEl) nomEl.textContent = vendeurInfos.nom || "Vendeur ROCYINTER";
  var emailEl = document.getElementById('emailVendeurAffiche');
  if(emailEl) emailEl.textContent = vendeurInfos.email || "";
  var av = document.getElementById('avatarVendeur');
  if(av){
    if(vendeurInfos.photo && vendeurInfos.photo.length>5){ av.innerHTML='<img src="'+vendeurInfos.photo+'">'; }
    else { av.textContent = (vendeurInfos.nom||"V").charAt(0); }
  }
}

function previewPhoto(input){
  if(input.files && input.files[0]){
    var reader = new FileReader();
    reader.onload = function(e){ photoBase64 = e.target.result; var img=document.getElementById('previewImg'); img.src=photoBase64; img.style.display='block'; };
    reader.readAsDataURL(input.files[0]);
  }
}

async function publier(){
  var btn = document.getElementById('btnPublier');
  var msgEl = document.getElementById('msg');
  var nom = document.getElementById('nom').value.trim();
  var prix = Number(document.getElementById('prix').value);
  var ville = document.getElementById('ville').value.trim();
  var stock = Number(document.getElementById('stock').value) || 1;
  var categorie = document.getElementById('categorie').value;
  var desc = document.getElementById('description').value.trim();
  var photoUrl = document.getElementById('photoUrl').value.trim();
  var photoFinale = photoUrl || photoBase64 || "";

  if(!nom || !prix || !ville || !desc){ msgEl.className="msg err"; msgEl.textContent="Remplis : Nom, Prix, Ville et Description."; return; }
  if(!photoFinale){ msgEl.className="msg err"; msgEl.textContent="Mets une photo du produit (fichier ou lien)."; return; }
  if(!vendeurInfos.id){ msgEl.className="msg err"; msgEl.textContent="Erreur vendeur : reconnecte-toi et réessaie."; return; }
  if(!vendeurInfos.nom || vendeurInfos.nom==="Vendeur" || vendeurInfos.nom==="V"){
    msgEl.className="msg err"; msgEl.textContent="Ton profil n'a pas de nom. Va dans Mon Profil, mets ton vrai nom, puis reviens publier."; return;
  }

  btn.disabled = true; btn.textContent = "Publication...";
  msgEl.className="msg"; msgEl.textContent="Publication en cours...";

  try{
    var aPublier = {
      nom: nom,
      prix: prix,
      ville: ville,
      stock: stock,
      categorie: categorie,
      description: desc,
      photo: photoFinale,
      image: photoFinale,
      // ===== JAMAIS VIDE : infos vendeur obligatoires =====
      vendeur_id: vendeurInfos.id,
      nom_vendeur: vendeurInfos.nom,
      email_vendeur: vendeurInfos.email,
      telephone_vendeur: vendeurInfos.telephone,
      photo_vendeur: vendeurInfos.photo,
      statut: 'en_attente_paiement'
    };
    var res = await supabaseClient.from('produits').insert([aPublier]).select().single();
    if(res.error) throw res.error;
    msgEl.className="msg ok"; msgEl.textContent="✅ Publié ! Vendeur : "+vendeurInfos.nom+" - Redirection...";
    setTimeout(function(){ window.location.href="article.html?id="+res.data.id; }, 1200);
  }catch(e){
    msgEl.className="msg err"; msgEl.textContent="Erreur : "+(e.message||JSON.stringify(e));
    btn.disabled=false; btn.textContent="🚀 PUBLIER MON PRODUIT";
  }
}

document.addEventListener("DOMContentLoaded", function(){
  var sel=document.getElementById("langue"); if(sel) sel.value=LANGUE_ACTUELLE;
  initSupabase(); chargerVendeur(); construireMenu();
});
</script>
</body>
</html>
