<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion - RocyInter</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="rocy_devise.js"></script>
<style>
*{box-sizing:border-box}html,body{height:100%}body{font-family:Arial,sans-serif;background:#f6f7fb;margin:0;padding:0;display:flex;flex-direction:column;min-height:100vh}
.container{max-width:440px;width:calc(100% - 24px);margin:20px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.06);flex:1 0 auto}
h2{text-align:center;color:#0a1a2f;margin-bottom:5px;font-size:20px}
p.sub{text-align:center;color:#666;font-size:14px;margin-top:0}
label{display:block;margin-top:14px;font-weight:bold;font-size:14px}
input[type="text"],input[type="password"],input[type="email"]{width:100%;padding:12px;margin-top:5px;border:1px solid #ddd;border-radius:8px;font-size:15px;box-sizing:border-box}
.btn{width:100%;background:#ff6b00;color:#fff;border:none;padding:15px;border-radius:10px;font-size:16px;font-weight:bold;margin-top:20px;cursor:pointer}
.btn:hover{background:#e65c00}.btn:disabled{background:#ccc;cursor:not-allowed}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px}
.check{font-weight:normal;display:flex;gap:6px;align-items:center;margin:0}
.oubli{color:#ff6b00;text-decoration:none;font-weight:bold}
.note{text-align:center;font-size:13px;color:#666;margin-top:15px;line-height:1.6}
.note a{color:#ff6b00;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h2 data-original="Connecte-toi">Connecte-toi</h2>
<p class="sub" data-original="Bienvenue sur RocyInter">Bienvenue sur RocyInter</p>
<p id="msgErreur" style="display:none;background:#FFE0E0;color:#C00;padding:10px;border-radius:8px;font-size:13px;text-align:center"></p>
<form onsubmit="connecter(event)">
<label data-original="Email ou Téléphone *">Email ou Téléphone *</label>
<input type="text" id="login" data-ph-original="Ex: toi@gmail.com ou +229..." placeholder="Ex: toi@gmail.com ou +229..." required>
<label data-original="Mot de passe *">Mot de passe *</label>
<div style="position:relative">
<input type="password" id="mdp" data-ph-original="Ton mot de passe" placeholder="Ton mot de passe" required style="padding-right:45px">
<button type="button" onclick="voirMdp()" style="position:absolute;right:8px;top:12px;border:none;background:none;cursor:pointer;font-size:16px">👁️</button>
</div>
<div class="row">
<label class="check"><input type="checkbox" id="rester" checked> <span data-original="Rester connecté">Rester connecté</span></label>
<a href="#" class="oubli" onclick="motDePasseOublie(); return false;" data-original="Mot de passe oublié ?">Mot de passe oublié ?</a>
</div>
<button class="btn" id="btnSeConnecter" type="submit" data-original="SE CONNECTER →">SE CONNECTER →</button>
</form>
<p class="note"><span data-original="Tu n'as pas de compte ?">Tu n'as pas de compte ?</span> <a href="inscription.html?v=2" data-original="Crée ton compte ici">Crée ton compte ici</a><br><br>
<a href="index.html" data-original="Continuer sans compte → Voir les produits">Continuer sans compte → Voir les produits</a></p>
</div>
<script>
// ===== CONNEXION.HTML - CONTENU SEUL - TOUT LE RESTE VIENT DE rocy_devise.js V7 =====
const EMAIL_ADMIN = "rocyinter@gmail.com";
let supabaseClient = null;
function getSupabase(){ if(supabaseClient) return supabaseClient; if(window.supabase){ try{ supabaseClient = window.supabase.createClient('https://ahoxxzmdjxqvvpphxeow.supabase.co', 'sb_publishable_Q2oaPQMj4H_cTlZCKKh6Jg_FVIa7VE3'); }catch(e){ supabaseClient = null; } } return supabaseClient; }
getSupabase();
function afficherErreur(msg){ var el=document.getElementById('msgErreur'); if(el){ el.style.display='block'; el.textContent=msg; } }
function cacherErreur(){ var el=document.getElementById('msgErreur'); if(el){ el.style.display='none'; } }
function voirMdp(){ var c=document.getElementById('mdp'); if(c) c.type=c.type==='password'?'text':'password'; }
function estAdmin(email){ return (email||"").trim().toLowerCase()===EMAIL_ADMIN.trim().toLowerCase(); }
function redirigerSelonRole(email, role){
  if(estAdmin(email)){ localStorage.setItem('role_user','admin'); }
  else { localStorage.setItem('role_user', role || 'acheteur'); }
  localStorage.removeItem('retour_apres_connexion');
  window.location.href = "index.html";
}
async function connecter(e){ if(e) e.preventDefault(); cacherErreur(); const login=document.getElementById('login').value.trim(); const password=document.getElementById('mdp').value; const btn=document.getElementById('btnSeConnecter'); if(!login || !password){ afficherErreur("Mets ton email / téléphone + ton mot de passe."); return; } if(btn){ btn.disabled=true; btn.textContent='Connexion...'; } let email=login; var sb = getSupabase(); try{ if(!sb){ afficherErreur("Supabase pas encore chargé, réessaie dans 2 secondes."); if(btn){ btn.disabled=false; btn.textContent="SE CONNECTER →"; } return; } if(!login.includes('@')){ const { data: prof } = await sb.from('profils').select('email').eq('telephone', login).single(); if(!prof?.email){ afficherErreur("Aucun compte avec ce téléphone."); if(btn){ btn.disabled=false; btn.textContent="SE CONNECTER →"; } return; } email=prof.email; } const { data, error } = await sb.auth.signInWithPassword({ email, password }); if(error){ afficherErreur("Mauvais email ou mauvais mot de passe. Essaie encore."); if(btn){ btn.disabled=false; btn.textContent="SE CONNECTER →"; } return; } const { data: profil } = await sb.from('profils').select('*').eq('id', data.user.id).single(); let role = profil?.role || 'acheteur'; if(email === "rocyinter@gmail.com") role = "admin"; localStorage.setItem("rocy_role", role); localStorage.setItem('nom_user', profil?.nom || profil?.nom_complet || ''); localStorage.setItem('email_user', email); localStorage.setItem('telephone_user', profil?.telephone || ''); localStorage.setItem('ville_user', profil?.ville || ''); localStorage.setItem('user_id', data.user.id); if(profil && profil.statut){ localStorage.setItem('statut_user', profil.statut); } else { localStorage.setItem('statut_user','gratuit'); } await sb.from('logs').insert([{ user_id: data.user.id, action: "connexion", date: new Date().toISOString() }]); alert("Bienvenue ! Tu es connecté !"); redirigerSelonRole(email, role); }catch(err){ afficherErreur('Erreur : '+err.message); if(btn){ btn.disabled=false; btn.textContent="SE CONNECTER →"; } } }
async function motDePasseOublie(){ const login=document.getElementById('login').value.trim(); if(!login){ alert("Écris d’abord ton email ou ton téléphone."); return; } var sb = getSupabase(); if(!sb){ alert("Supabase pas encore chargé, réessaie dans 2 secondes."); return; } let email=login; if(!login.includes('@')){ const { data: prof } = await sb.from('profils').select('email').eq('telephone', login).single(); if(!prof?.email){ alert("Aucun compte avec ce téléphone."); return; } email=prof.email; } const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/connexion.html' }); if(error){ alert(error.message); return; } alert("Lien envoyé à "+email+". Vérifie aussi dans Spam."); }
window.connecter = connecter; window.voirMdp = voirMdp; window.motDePasseOublie = motDePasseOublie;
</script>
</body>
</html>
